# Configuration Supabase pour ReelVault.
# project_id sert au développement local ; le lien réel se fait via `supabase link --project-ref <ref>`.
project_id = "reelvault"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "reelvault://"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Edge Functions
[functions.meta-webhook]
verify_jwt = false

[functions.enrich-reel]
verify_jwt = false

[functions.classify-reel]
verify_jwt = false

[functions.add-reel]
verify_jwt = true

[functions.push-notify]
verify_jwt = false

[functions.generate-digest]
verify_jwt = false
